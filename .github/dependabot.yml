version: 2

updates:
  - package-ecosystem: npm
    directory: /
    cooldown:
      default-days: 7
      semver-patch-days: 3
    schedule:
      interval: cron
      cronjob: "0 8 * * *" # Every day at 08:00

  - package-ecosystem: github-actions
    directory: /
    cooldown:
      default-days: 7
      semver-patch-days: 3
    schedule:
      interval: cron
      cronjob: "0 8 * * *" # Every day at 08:00
